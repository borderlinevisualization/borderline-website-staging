<style>
/* Layout: a plain vertical gallery. Justified rows keep every render at its true ratio; wide renders take a row alone. Same paper and type as the homepage, no scroll theatre. */
:root {
  --paper: #F3F1EE;
  --ink: #1A1816;
  --muted: #6E6A64;
  --faint: #CFC8BF;
  --shade: #E6E1DA;
  --scrim: rgba(20,18,16,.96);
  --on-scrim: #F3F1EE;
  --sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --gap: 10px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid currentColor; outline-offset: 3px; }
p, h1 { margin: 0; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); }
.topbar .in { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-left: max(28px, var(--gl)); padding-right: max(28px, var(--gr)); }
.brand { width: 150px; flex: none; display: block; }
.brand svg { display: block; width: 100%; height: auto; aspect-ratio: 13400 / 1450; fill: var(--ink); }
.topnav { display: flex; align-items: center; gap: clamp(16px, 2.2vw, 32px); }
.topnav a { font-weight: 300; font-size: 14px; text-decoration: none; }
.topnav a:hover, .topnav a[aria-current] { text-decoration: underline; text-underline-offset: 5px; }
.tlink { font-weight: 400; font-size: 15px; text-decoration: none !important; border-bottom: 1px solid currentColor; padding-bottom: 3px; white-space: nowrap; }

.head { padding: 28px var(--gr) 12px var(--gl); margin: 0 max(0px, calc(28px - var(--gl))); }
.head h1 { font-weight: 200; font-size: clamp(28px, 3vw, 44px); letter-spacing: -0.015em; line-height: 1.1; }
.head h1 span { font-size: 14px; font-weight: 300; color: var(--muted); letter-spacing: 0; margin-left: 12px; font-variant-numeric: tabular-nums; }
.filterbar { position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); z-index: 15; background: transparent; transition: background-color .2s, border-color .2s; padding: 4px var(--gr) 0 var(--gl); margin: 0 max(0px, calc(28px - var(--gl))); border-bottom: 1px solid var(--faint); }
/* Stuck: no background; the labels invert against whatever passes behind them */
.filterbar.stuck { background: transparent !important; border-bottom-color: transparent; mix-blend-mode: difference; }
.filterbar.stuck .filters button { color: rgba(255,255,255,.72); }
.filterbar.stuck .filters button:hover, .filterbar.stuck .filters button[aria-pressed="true"] { color: #fff; border-bottom-color: #fff; }
.filters button { transition: color .2s, border-color .2s; }
@media (min-width: 761px) { .filterbar .filters { justify-content: flex-end; } .filterbar { pointer-events: none; } .filterbar .filters { pointer-events: auto; } }
.filters { display: flex; gap: 6px 22px; flex-wrap: wrap; }
.filters button { background: none; border: 0; padding: 10px 0 11px; margin-bottom: -1px; cursor: pointer; font-size: 14px; font-weight: 300; color: var(--muted); border-bottom: 1px solid transparent; }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--ink); font-weight: 400; border-bottom-color: var(--ink); }

.gallery { padding: var(--gap) var(--gr) 0 var(--gl); }
.row { display: flex; gap: var(--gap); margin-bottom: var(--gap); }
.row.center { justify-content: center; }
.gallery.out .row { opacity: 0; transition: opacity .17s ease; }
.gallery.in .row { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .gallery.in .row { animation: fadeonly .25s ease both; } @keyframes fadeonly { from { opacity: 0; } to { opacity: 1; } } }
.tile { padding: 0; border: 0; background: var(--shade); cursor: zoom-in; overflow: hidden; flex: none; }
.tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .4s; }
.tile:hover img { transform: scale(1.02); }

.close { display: flex; align-items: center; gap: 0; padding: clamp(64px, 10vw, 120px) var(--gr) 64px var(--gl); flex-wrap: wrap; row-gap: 20px; }
.close p { font-weight: 200; font-size: clamp(24px, 2.4vw, 38px); letter-spacing: -0.015em; flex: 0 0 100%; }
.close .line { flex: 1; height: 1px; background: var(--ink); min-width: 40px; }
.close svg { width: 24px; height: 24px; fill: var(--ink); flex: none; margin-right: 14px; }
.foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 18px var(--gr) 24px var(--gl); border-top: 1px solid var(--faint); }

.lb { position: fixed; inset: 0; z-index: 50; background: var(--scrim); color: var(--on-scrim); display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top, 0px) var(--gr) env(safe-area-inset-bottom, 0px) var(--gl); }
.lb-top, .lb-bot { display: flex; justify-content: space-between; align-items: center; height: 60px; font-size: 13px; font-weight: 300; font-variant-numeric: tabular-nums; }
.lb-stage { position: relative; min-height: 0; margin: 0 clamp(0px, 3vw, 56px); }
.lb-stage .lbl { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; opacity: 0; transition: opacity .35s ease; }
.lb-stage .lbl.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .lb-stage .lbl { transition: none; } }
.lb button { background: none; border: 0; cursor: pointer; color: var(--on-scrim); }
.lb .x { width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; opacity: .8; }
.lb .x:hover { opacity: 1; }
.lb .x svg { width: 20px; height: 20px; }
.lb button:focus:not(:focus-visible) { outline: none; }
.lb .nav { position: absolute; top: 0; bottom: 0; width: 30%; display: flex; align-items: center; padding: 0 8px; opacity: .55; }
.lb .nav:hover { opacity: 1; }
.lb .prev { left: 0; justify-content: flex-start; cursor: w-resize; }
.lb .next { right: 0; justify-content: flex-end; cursor: e-resize; }
.lb .nav svg { width: 28px; height: 14px; }

@media (max-width: 760px) {
  .topbar .in { height: 64px; }
  .filterbar { top: calc(64px + env(safe-area-inset-top, 0px)); margin: 0; background: var(--paper); }
  .brand { width: 124px; }
  .topnav a:not(.tlink) { display: none; }
  .head { margin: 0; }
  .filters { overflow-x: auto; flex-wrap: nowrap; width: 100%; scrollbar-width: none; }
  .filters button { white-space: nowrap; }
  :root { --gap: 6px; }
  .lb .nav { width: 22%; }
}
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } .tile:hover img { transform: none; } }

/* Narrow phones: keep the longer CTA on one line */
@media (max-width: 360px) { .brand { width: 104px; } .topbar .tlink { font-size: 14px; } }

/* Social icons: floating round buttons in the WhatsApp spot, faded in on Contact (home) or at the end of the page (Work) */
.social { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; gap: 10px; pointer-events: none; }
.social a { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
.social a + a { transition-delay: .1s; }
.foot { padding-right: calc(20px + 106px + 24px); } /* keep footer text clear of the floating buttons */
.social.in { pointer-events: auto; }
.social.in a { opacity: 1; transform: none; }
.social svg { width: 22px; height: 22px; }
@media (prefers-reduced-motion: reduce) { .social a { transition: none; } }
</style>

        if (cost < best[j]) { best[j] = cost; cut[j] = i; }
      }
    }
    const rows = [];
    for (let j = n; j > 0; j = cut[j]) rows.unshift(items.slice(cut[j], j));
    return rows;
  }

  function build() {
    shown = order.filter(w => cat === 'all' || w.cat === cat);
    const cs = getComputedStyle(gallery);
    const W = gallery.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 10;
    const narrow = W < 700;
    const target = narrow ? Math.max(150, W * 0.5) : Math.min(520, Math.max(300, W * 0.27));
    const maxH = Math.max(target * 1.5, Math.min(innerHeight * 0.8, 760));

    /* split into blocks around wide renders, then balance each block */
    const rows = []; let block = [];
    const flushBlock = () => { if (block.length) rows.push(...partition(block, W, gap, target, narrow || block.length < 2 ? 1 : 2)); block = []; };
    for (const w of shown) {
      block.push(w);
    }
    flushBlock();

    const frag = document.createDocumentFragment(); let idx = 0;
    rows.forEach((items, ri) => {
      const sum = items.reduce((t, w) => t + ar(w), 0);
      let h = (W - gap * (items.length - 1)) / sum;
      const capped = h > maxH; if (capped) h = maxH;   /* only a lone tall image hits this */
      const el = document.createElement('div'); el.className = 'row' + (capped ? ' center' : '');
      el.style.setProperty('--d', Math.min(ri, 8) * 70 + 'ms');
      let used = 0;
      items.forEach((w, k) => {
        const i = idx++;
        let wd = Math.floor(ar(w) * h);
        if (!capped && k === items.length - 1) wd = Math.max(1, Math.round(W - used - gap * k));
        used += wd;
        const b = document.createElement('button');
        b.className = 'tile'; b.type = 'button';
        b.style.width = wd + 'px'; b.style.height = Math.round(h) + 'px';
        b.setAttribute('aria-label', 'Open image ' + (i + 1));
        b.innerHTML = `<img src="${w.src}" srcset="${w.src} 1000w, ${w.full} 2000w" sizes="${wd}px" alt="${ALT[w.cat] || 'Architectural visualization'}" loading="${i < 8 ? 'eager' : 'lazy'}" width="${w.w}" height="${w.h}">`;
        b.addEventListener('click', () => open(i));
        el.appendChild(b);
      });
      frag.appendChild(el);
    });
    gallery.replaceChildren(frag);
  }

  /* Transition C: old grid fades out quickly, new rows rise in one after another */
  let busy = 0;
  function render(animate) {
    const ticket = ++busy;
    const enter = () => {
      if (ticket !== busy) return;
      build();
      if (animate) { gallery.classList.remove('out'); gallery.classList.add('in'); setTimeout(() => ticket === busy && gallery.classList.remove('in'), 1400); }
    };
    if (animate && gallery.children.length) { gallery.classList.remove('in'); gallery.classList.add('out'); setTimeout(enter, reduce ? 0 : 170); }
    else enter();
  }

  filters.forEach(b => b.addEventListener('click', () => {
    if (b.dataset.cat === cat) return;
    cat = b.dataset.cat;
    filters.forEach(x => x.setAttribute('aria-pressed', x === b));
    const bars = document.querySelector('.topbar').offsetHeight + document.getElementById('filterbar').offsetHeight;
    const top = gallery.getBoundingClientRect().top + scrollY - bars;
    if (scrollY > top + 4) scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' });
    render(true);
  }));
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => render(false), 120); });


  /* Desktop: filters share the title row, right-aligned, then stick under the top bar */
  const bar = document.getElementById('filterbar'), topbar = document.querySelector('.topbar');
  const wide = matchMedia('(min-width: 761px)');
  const placeBar = () => { bar.style.marginTop = wide.matches ? -bar.offsetHeight + 'px' : ''; stuck(); };
  const stuck = () => bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= topbar.offsetHeight + 1 && scrollY > 2);
  addEventListener('scroll', stuck, { passive: true });
  wide.addEventListener('change', placeBar);
  addEventListener('resize', placeBar);
  placeBar();

  /* Always open at the top, whatever scroll position the previous page left behind */
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  scrollTo(0, 0);
  addEventListener('pageshow', () => scrollTo(0, 0));
  render(true);

  /* Lightbox: two layers crossfade; a picture only swaps in once it is decoded; neighbours load ahead */
  const lb = document.getElementById('lb');
  const layers = [...document.querySelectorAll('#lbStage .lbl')];
  let front = 0, cur = 0, lastFocus = null, req = 0;
  const cache = new Map();
  const big = w => w.full || w.src;
  function load(url) {
    if (!cache.has(url)) {
      const im = new Image(); im.decoding = 'async'; im.src = url;
      cache.set(url, (im.decode ? im.decode() : new Promise((ok, no) => { im.onload = ok; im.onerror = no; })).then(() => url, () => url));
    }
    return cache.get(url);
  }
  function put(url, instant) {
    const next = layers[1 - front], prev = layers[front];
    next.src = url;
    if (instant) { next.style.transition = prev.style.transition = 'none'; }
    next.classList.add('on'); prev.classList.remove('on');
    if (instant) requestAnimationFrame(() => { next.style.transition = prev.style.transition = ''; });
    front = 1 - front;
  }
  function preload() {
    if (shown.length < 2) return;
    load(big(shown[(cur + 1) % shown.length]));
    load(big(shown[(cur - 1 + shown.length) % shown.length]));
  }
  function show(i, first) {
    cur = (i + shown.length) % shown.length;
    const w = shown[cur], id = ++req;
    if (first) put(w.src, true);             /* grid thumbnail is already in memory: no blank frame */
    load(big(w)).then(url => { if (id === req) { if (first && url === w.src) return; put(url, false); preload(); } });
  }
  function open(i) {
    lastFocus = document.activeElement;
    layers.forEach(l => { l.classList.remove('on'); l.removeAttribute('src'); });
    lb.hidden = false; document.body.style.overflow = 'hidden';
    show(i, true);
    document.getElementById('lbClose').focus();
  }
  function close() { lb.hidden = true; document.body.style.overflow = ''; req++; lastFocus && lastFocus.focus(); }
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', () => show(cur - 1));
  document.getElementById('lbNext').addEventListener('click', () => show(cur + 1));
  addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  let sx = null;
  const stage = document.getElementById('lbStage');
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
})();
</script>
<script>
(() => {
  /* Social buttons fade in as the closing section comes into view, and step back when scrolling up */
  const s = document.querySelector('.social'), end = document.querySelector('.close') || document.querySelector('.foot');
  if (!s || !end) return;
  if (!('IntersectionObserver' in window)) { s.classList.add('in'); return; }
  new IntersectionObserver(es => es.forEach(e => s.classList.toggle('in', e.isIntersecting)), { threshold: 0.25 }).observe(end);
})();
</script>
